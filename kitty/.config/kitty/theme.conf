# Font.
font_family Departure Mono

# Keep the cursor as a block.
shell_integration no-cursor
cursor_shape block

# Padding.
window_padding_width 7 10

# Scroll back up to 3000 lines.
scrollback_lines 3000

#Default font size.
font_size 10

# Just a keybind to change font size to your liking.
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Background opacity, set to 0 if you want blur/transparency.
# Blur works with hyprland, or sway-fx as a drop-in replacement for sway.
background_opacity 0.9


# Finally, the COLORS! these use the design system I made for this rice.
cursor               #88e5ec

selection_background #88e5ec
selection_foreground #0c0c0c

background           #0c0c0c
foreground           #ffffff

